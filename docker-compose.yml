services:
  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - budget-network

  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    volumes:
      - budget_data:/app/data
    restart: unless-stopped
    networks:
      - budget-network

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - budget-network

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agent_service
    depends_on:
      - postgres
      - backend-service
    restart: unless-stopped
    networks:
      - budget-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8502:80"
    depends_on:
      - frontend-service
      - backend-service
      - agent-service
    restart: unless-stopped
    networks:
      - budget-network

networks:
  budget-network:
    driver: bridge

volumes:
  budget_data:
    name: budget_data
    external: true
  postgres_data:
    name: agent_postgres_data
