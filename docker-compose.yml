services:
  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - budget-network

  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - budget_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - budget-network

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - budget-network

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-v4-pro}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agent_service
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      backend-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - budget-network

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8504:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - budget-network

  nocodb:
    image: nocodb/nocodb:latest
    environment:
      NC_ADMIN_EMAIL: ${NC_ADMIN_EMAIL}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
    ports:
      - "8505:8080"
    volumes:
      - nocodb_data:/usr/app/data
      - budget_data:/data/budget:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - budget-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8502:80"
    depends_on:
      - frontend-service
      - backend-service
      - agent-service
    restart: unless-stopped
    networks:
      - budget-network

networks:
  budget-network:
    driver: bridge

volumes:
  budget_data:
    name: budget_data
    external: true
  postgres_data:
    name: agent_postgres_data
  pgadmin_data:
    name: pgadmin_data
  nocodb_data:
    name: nocodb_data
