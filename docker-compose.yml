services:
  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - budget-network

  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - budget_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - budget-network

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - budget-network

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-v4-pro}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agent_service
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      backend-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - budget-network

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - "8503:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - budget-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8502:80"
    depends_on:
      - frontend-service
      - backend-service
      - agent-service
    restart: unless-stopped
    networks:
      - budget-network

networks:
  budget-network:
    driver: bridge

volumes:
  budget_data:
    name: budget_data
    external: true
  postgres_data:
    name: agent_postgres_data
