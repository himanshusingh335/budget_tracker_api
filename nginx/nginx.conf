events {}

http {
    client_max_body_size 10m;

    upstream frontend_upstream {
        server frontend-service:80;
    }

    upstream backend_upstream {
        server backend-service:8502;
    }

    upstream agent_upstream {
        server agent-service:8000;
    }

    server {
        listen 80;

        location /chat/ {
            proxy_pass http://agent_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Read-only from outside: rows are POSTed by the email-ingest job directly
        # to backend-service:8502 on the docker network, bypassing nginx.
        location ~ ^/email-transactions(/|$) {
            limit_except GET { deny all; }
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/(summary|budget|transactions|query|classify|mcp|docs|redoc|openapi\.json)(/|$) {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
        }
    }
}
